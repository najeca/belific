<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Belific task details, version B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 720px; height: 780px; box-sizing: border-box; background: #ECE7DB; font-family: Inter, sans-serif; color: #1B1B1B; padding: 40px 50px 50px 40px;">
<div style="position: relative; height: 100%;">
<div style="position: absolute; left: 10px; top: 10px; right: -10px; bottom: -10px; background: #D3CCBB; border-radius: 16px;"></div>
<div style="position: relative; height: 100%; background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
<div style="height: 8px; background: #5C7A6B;"></div>
<div style="padding: 26px 34px 0; display: flex; align-items: center; gap: 14px;">
<span style="width: 26px; height: 26px; border-radius: 50%; border: 3px solid #1B1B1B; box-sizing: border-box; flex: none;"></span>
<p style="margin: 0; flex: 1; font-size: 30px; font-weight: 800; letter-spacing: -0.6px;">Plan the week</p>
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1B1B1B; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="width: 80px; height: 4px; background: #E6E0D2; margin: 22px auto 14px;"></div>
<div style="padding: 0 34px; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Day</span><span style="font-size: 16px; font-weight: 700;">Mon 2 Nov</span><span style="margin-left: auto; font-size: 14px; color: #6B6B6B;">No time</span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Length</span><span style="display: flex; gap: 8px;"><span style="background: #F3EFE6; font-size: 14px; font-weight: 700; padding: 7px 12px;">0:15</span><span style="background: #5C7A6B; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 7px 12px;">0:30</span><span style="background: #F3EFE6; font-size: 14px; font-weight: 700; padding: 7px 12px;">1:00</span><span style="background: #F3EFE6; font-size: 14px; font-weight: 700; padding: 7px 12px;">2:00</span></span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Label</span><span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #5C7A6B;"></span>Work</span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Important</span>
<span style="display: flex; gap: 12px;"><span aria-label="No" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1B1B; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span><span aria-label="Yes" style="width: 40px; height: 40px; border-radius: 50%; border: 3px solid #D3CCBB; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Repeats</span><span style="font-size: 16px; font-weight: 700;">Every Monday</span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">Type</span><span style="display: flex;"><span style="background: #5C7A6B; color: #FFFFFF; font-size: 16px; font-weight: 700; padding: 8px 18px;">Task</span><span style="background: #E6EEE8; color: #3B5646; font-size: 16px; font-weight: 700; padding: 8px 18px;">Break</span></span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px;"><span style="width: 130px; font-size: 15px; font-weight: 700; color: #6B6B6B;">List</span><span style="font-size: 16px; font-weight: 700;">Brain dump</span></div>
</div>
<div style="width: 80px; height: 4px; background: #E6E0D2; margin: 18px auto;"></div>
<div style="padding: 0 34px; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 15px; font-weight: 700; color: #6B6B6B;">Notes</span>
<div style="background: #F3EFE6; border-radius: 10px; padding: 14px 16px; font-size: 15px; color: #6B6B6B; min-height: 70px; box-sizing: border-box;">Add any notes to the task</div>
<span style="font-size: 15px; font-weight: 700; color: #6B6B6B; margin-top: 8px;">Steps <b style="color: #1B1B1B;">0 of 0</b></span>
<span style="font-size: 15px; font-weight: 700; color: #44604F;">+ Add a step</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":780}}'>

}

</body>
</html>
